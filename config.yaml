# 棋盘格参数
checkerboard_args:
  XX : 8  #横向内角点数，比方格数少1
  YY : 5  #纵向内角点数，比方格数少1
  L : 0.02772 #标定板一格的长度  单位为米 注：这个值是A4纸张上打印的棋盘格的测量边长。建议通过测量横向多个黑白片再获取L的实际长度

calibration_args:
  max_reprojection_error_px: 2.0 # 单张图片的重投影均方根误差限值
  max_position_error_mm: 12.0 # 固定关系位置的最大偏差限值
  max_rotation_error_deg: 3.0 # 固定关系姿态的最大偏差限值
